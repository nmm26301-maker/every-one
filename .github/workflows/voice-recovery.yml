name: Voice capture and speech recovery
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo apt-get update -qq && sudo apt-get install -y libandroid-json-java
      - run: |
          bash tests/test-voice-buffer.sh
          bash tests/test-conversation-boundary.sh
          bash tests/test-mic-capture.sh
          bash tests/test-deadline-recovery.sh
          bash tests/test-speech-streaming.sh
          python3 tests/test-exact-apk.py
          python3 tests/test-cloud-job-recovery.py
          bash tests/test-journey.sh
          bash tests/test-phones.sh
