name: Android media recovery and export checks
on:
  push:
    branches: [release/everyone-5.0.13-media-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Host module checks
        run: |
          bash tests/test-journey-subtitles.sh
          python3 -m unittest discover -s tests -p 'test_sensevoice_yue.py' -v
          python3 tests/journey-content.py
      - name: Build disposable module and instrumentation
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          jar="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p build/media/classes build/media/dex build/test/classes build/test/dex build/test/assets output
          sources=()
          for name in Subtitles Cantonese QuickStart Jyutping CantoneseAsr PracticeAudio ToneAudio ToneContour ToneCompare TonePlotView SpeechGuide ImmersionActivity; do
            sources+=("app/src/main/java/org/openenglish/reader/Journey${name}.java")
          done
          javac -encoding UTF-8 -source 8 -target 8 -cp "$jar" -d build/media/classes "${sources[@]}" tests/instrumentation/JourneyActivity.java
          mapfile -t classes < <(find build/media/classes -name '*.class')
          "$tools/d8" --min-api 23 --lib "$jar" --output build/media/dex "${classes[@]}"
          "$tools/aapt2" link -o build/media/unsigned.apk -I "$jar" --manifest tests/instrumentation/MediaModuleManifest.xml
          (cd build/media/dex && zip -q ../unsigned.apk classes.dex)
          javac -encoding UTF-8 -source 8 -target 8 -cp "$jar" -d build/test/classes tests/instrumentation/ImmersionValidation.java
          mapfile -t classes < <(find build/test/classes -name '*.class')
          "$tools/d8" --min-api 23 --lib "$jar" --output build/test/dex "${classes[@]}"
          cp tests/media/*.srt build/test/assets/
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=navy:s=320x180:r=15 -f lavfi -i sine=frequency=440:sample_rate=16000 -t 20 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart build/test/assets/video.mp4
          "$tools/aapt2" link -o build/test/unsigned.apk -I "$jar" --manifest tests/instrumentation/ImmersionManifest.xml -A build/test/assets
          (cd build/test/dex && zip -q ../unsigned.apk classes.dex)
          keytool -genkeypair -keystore build/test.jks -storepass android -keypass android -alias test -dname CN=DisposableModuleTest -keyalg RSA -validity 2
          "$tools/apksigner" sign --ks build/test.jks --ks-pass pass:android --out build/media/app.apk build/media/unsigned.apk
          "$tools/apksigner" sign --ks build/test.jks --ks-pass pass:android --out build/test/app.apk build/test/unsigned.apk
          sudo rm -rf "${ANDROID_HOME:?}/ndk"
          sudo chmod 666 /dev/kvm
      - name: Android media validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 180
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          script: |
            adb install build/media/app.apk
            adb shell pm grant org.openenglish.reader android.permission.RECORD_AUDIO
            adb install build/test/app.apk
            adb shell am instrument -w org.openenglish.reader.tests/.ImmersionValidation > output/INTEGRATION-CHECKS.txt
            cat output/INTEGRATION-CHECKS.txt
            grep -q IMMERSION_VALIDATION_PASS output/INTEGRATION-CHECKS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-validation-report
          path: output/*.txt
